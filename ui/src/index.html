<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <title>Hark</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- CSP: deny remote content; allow inline styles (Tailwind base) and
         ws://127.0.0.1:* (the harkd loopback bind). No `unsafe-eval`, no
         remote scripts. Per privacy hard rule #3 + ADR-0001.
         `media-src 'self' blob:` lets the Post-Meeting Review screen play the
         locally-read meeting audio via a URL.createObjectURL(blob) source — the
         bytes come from main's validated, vault-internal read (NOT the network),
         so this does NOT widen connect-src/script-src or admit any remote
         origin. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline';
                   font-src 'self' data:;
                   connect-src 'self' ws://127.0.0.1:*;
                   img-src 'self' data:;
                   media-src 'self' blob:;
                   object-src 'none';
                   base-uri 'self';">
  </head>
  <body>
    <!-- Surface hosts. src/main.ts bootstraps EXACTLY ONE of these based on the
         URL hash: the main app shell normally, or the menu-bar popover when the
         frameless tray window loads index.html with `#tray`. The unmatched host
         stays an inert, empty custom element. -->
    <hark-root></hark-root>
    <hark-tray-popover></hark-tray-popover>
  </body>
</html>
